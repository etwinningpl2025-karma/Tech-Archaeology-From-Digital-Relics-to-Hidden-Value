<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tech-Archaeology: From Digital Relics to Hidden Value</title>
  <meta name="description" content="An international eTwinning project exploring e-waste, digital archaeology, and sustainable future." />
  
  <!-- Google Fonts & Font Awesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    :root {
      --bg-dark: #1b263b;
      --card-bg: #223049;
      --card-border: #3b4d6c;
      --accent-cyan: #38bdf8;
      --accent-green: #34d399;
      --text-main: #f1f5f9;
      --text-muted: #cbd5e1;
      --accent-red: #f87171;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(27, 38, 59, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border);
    }

    nav {
      max-width: 1250px;
      margin: 0 auto;
      padding: 0.9rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .logo {
      font-weight: 800;
      font-size: 1.25rem;
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-green));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
      cursor: pointer;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 1.2rem;
    }

    .nav-links {
      display: flex;
      list-style: none;
      gap: 0.4rem;
    }

    .nav-links a {
      color: var(--accent-red) !important;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.82rem;
      padding: 0.45rem 0.7rem;
      border-radius: 8px;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .nav-links a:hover {
      background: rgba(248, 113, 113, 0.15);
    }

    .nav-links a.active {
      background: rgba(248, 113, 113, 0.2);
    }

    .lang-switcher {
      display: flex;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 2px;
    }

    .lang-btn {
      border: none;
      background: transparent;
      color: var(--text-muted);
      padding: 0.3rem 0.65rem;
      font-size: 0.75rem;
      font-weight: 700;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .lang-btn.active {
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-green));
      color: #1b263b;
    }

    main {
      flex: 1;
      max-width: 1250px;
      width: 100%;
      margin: 0 auto;
      padding: 2rem 1.5rem 4rem;
    }

    .page-section {
      display: none;
      animation: fadeIn 0.35s ease forwards;
    }

    .page-section.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .hero-banner-container {
      margin-bottom: 2rem;
    }

    .hero-banner-container img {
      width: 100%;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(56, 189, 248, 0.15);
      border: 1px solid var(--card-border);
      display: block;
    }

    .counter-strip {
      background: linear-gradient(90deg, rgba(56, 189, 248, 0.1), rgba(52, 211, 153, 0.1));
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 0.8rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .counter-label {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.9rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .counter-label i {
      color: var(--accent-cyan);
      font-size: 1.1rem;
    }

    .counter-odometer {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #141d2f;
      border: 1px solid var(--card-border);
      padding: 0.35rem 0.8rem;
      border-radius: 8px;
      font-family: monospace;
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--accent-green);
      letter-spacing: 2px;
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.3);
    }

    .section-title {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .section-title h2 {
      font-size: 2.1rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
      color: #fff;
    }

    .section-title p {
      color: var(--text-muted);
      font-size: 1rem;
    }

    .home-hero-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 2.5rem;
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 2rem;
      align-items: center;
      margin-bottom: 2.5rem;
    }

    .home-hero-text h3 {
      font-size: 1.8rem;
      margin-bottom: 1rem;
      color: var(--accent-cyan);
    }

    .home-hero-text p {
      color: var(--text-muted);
      margin-bottom: 1.5rem;
    }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
    }

    .stat-badge {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      padding: 1.2rem;
      border-radius: 12px;
      text-align: center;
    }

    .stat-badge strong {
      display: block;
      font-size: 1.4rem;
      color: var(--accent-green);
    }

    .stat-badge span {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .quick-cta-row {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-green));
      color: #1b263b;
      font-weight: 700;
      font-size: 0.88rem;
      padding: 0.7rem 1.3rem;
      border-radius: 25px;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: opacity 0.3s ease;
    }

    .btn-primary:hover {
      opacity: 0.9;
    }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-main);
      border: 1px solid var(--card-border);
      font-weight: 600;
      font-size: 0.88rem;
      padding: 0.7rem 1.3rem;
      border-radius: 25px;
      text-decoration: none;
      cursor: pointer;
    }

    .pretest-wrapper {
      background: linear-gradient(145deg, #24344d, #223049);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 2.2rem;
      margin-bottom: 3rem;
    }

    .pretest-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.5rem;
      margin-top: 1.5rem;
    }

    .pretest-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 1.6rem;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.3s ease, border-color 0.3s ease;
    }

    .pretest-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent-cyan);
    }

    .pretest-icon {
      font-size: 2.2rem;
      margin-bottom: 0.8rem;
    }

    .pretest-card h4 {
      font-size: 1.1rem;
      color: #fff;
      margin-bottom: 0.4rem;
    }

    .pretest-card p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 1.4rem;
    }

    .teachers-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .teacher-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 1.5rem;
      display: flex;
      gap: 1.2rem;
      align-items: center;
      transition: all 0.3s ease;
    }

    .teacher-card:hover {
      transform: translateY(-3px);
      border-color: var(--accent-cyan);
    }

    .teacher-avatar-box {
      width: 65px;
      height: 65px;
      min-width: 65px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.2), rgba(52, 211, 153, 0.2));
      border: 2px solid var(--accent-cyan);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      color: var(--text-main);
    }

    .teacher-details h4 {
      font-size: 1.05rem;
      color: #fff;
      margin-bottom: 0.1rem;
    }

    .teacher-role {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent-cyan);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 0.2rem;
      display: block;
    }

    .teacher-school {
      font-size: 0.88rem;
      color: var(--text-main);
      font-weight: 600;
    }

    .teacher-location {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 0.2rem;
    }

    .pillars-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 1.2rem;
    }

    .pillar-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 1.8rem 1.2rem;
      border-radius: 16px;
      text-align: center;
      transition: transform 0.3s ease;
    }

    .pillar-card:hover {
      transform: translateY(-4px);
    }

    .pillar-icon {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(56, 189, 248, 0.15);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      color: var(--accent-cyan);
      margin-bottom: 1rem;
    }

    .pillar-card:nth-child(even) .pillar-icon {
      background: rgba(52, 211, 153, 0.15);
      color: var(--accent-green);
    }

    .pillar-card h3 {
      font-size: 1.05rem;
      margin-bottom: 0.5rem;
      color: #fff;
    }

    .pillar-card p {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .padlet-community-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 1.5rem;
      margin-bottom: 3rem;
    }

    .padlet-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 1.8rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.3s ease;
    }

    .padlet-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent-cyan);
    }

    .padlet-card-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .padlet-icon-box {
      width: 50px;
      height: 50px;
      border-radius: 12px;
      background: rgba(56, 189, 248, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      color: var(--accent-cyan);
    }

    .padlet-card:nth-child(2) .padlet-icon-box {
      background: rgba(52, 211, 153, 0.15);
      color: var(--accent-green);
    }

    .padlet-card:nth-child(3) .padlet-icon-box {
      background: rgba(250, 204, 21, 0.15);
      color: #facc15;
    }

    .padlet-card-title h3 {
      font-size: 1.15rem;
      color: #fff;
    }

    .padlet-card-title span {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent-cyan);
      text-transform: uppercase;
    }

    .padlet-card p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }

    .padlet-link-btn {
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 0.75rem 1.2rem;
      border-radius: 12px;
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .padlet-link-btn:hover {
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-green));
      color: #1b263b;
    }

    .partners-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.2rem;
    }

    .partner-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 1.3rem;
      border-radius: 14px;
      display: flex;
      align-items: center;
      gap: 1.2rem;
    }

    .partner-flag {
      font-size: 2rem;
    }

    .partner-info h4 {
      font-size: 1rem;
      color: #fff;
    }

    .partner-info p {
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .timeline-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.5rem;
    }

    .timeline-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 2rem 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.3s ease;
    }

    .timeline-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent-green);
    }

    .month-badge {
      display: inline-block;
      align-self: flex-start;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent-cyan);
      font-weight: 700;
      font-size: 0.8rem;
      padding: 0.35rem 0.85rem;
      border-radius: 20px;
      margin-bottom: 1.2rem;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .timeline-card:nth-child(even) .month-badge {
      background: rgba(52, 211, 153, 0.15);
      color: var(--accent-green);
      border-color: rgba(52, 211, 153, 0.3);
    }

    .timeline-card h3 {
      font-size: 1.2rem;
      margin-bottom: 0.8rem;
      color: #fff;
    }

    .timeline-card p {
      color: var(--text-muted);
      font-size: 0.92rem;
      margin-bottom: 1.2rem;
      flex-grow: 1;
    }

    .tool-tag-container {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .tool-tag {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--card-border);
      padding: 0.3rem 0.65rem;
      border-radius: 8px;
      font-size: 0.75rem;
      color: var(--accent-cyan);
      font-weight: 600;
    }

    .outcomes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 1.5rem;
    }

    .outcome-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.3s ease;
    }

    .outcome-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent-cyan);
    }

    .outcome-card h3 {
      font-size: 1.2rem;
      margin: 1rem 0 0.5rem;
      color: #fff;
    }

    .outcome-card p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }

    .outcome-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent-cyan);
      border: 1px solid var(--accent-cyan);
      padding: 0.55rem 1.2rem;
      border-radius: 20px;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      align-self: flex-start;
    }

    .outcome-btn:hover {
      background: var(--accent-cyan);
      color: #1b263b;
    }

    .esafety-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 2.2rem;
    }

    .esafety-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1.5rem;
      margin-top: 1.5rem;
    }

    .esafety-item {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.3rem;
    }

    .esafety-item i {
      font-size: 1.5rem;
      color: var(--accent-green);
      margin-bottom: 0.8rem;
    }

    .esafety-item h4 {
      font-size: 1rem;
      margin-bottom: 0.4rem;
      color: #fff;
    }

    .esafety-item p {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .contact-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
    }

    .contact-info, .contact-links {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 2rem;
    }

    .contact-info h3, .contact-links h3 {
      font-size: 1.3rem;
      margin-bottom: 1.2rem;
      color: var(--accent-cyan);
    }

    .contact-card-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      padding: 0.8rem 1rem;
      border-radius: 12px;
      text-decoration: none;
      color: var(--text-main);
      margin-bottom: 0.8rem;
      transition: all 0.3s ease;
    }

    .contact-card-item:hover {
      border-color: var(--accent-cyan);
      background: rgba(56, 189, 248, 0.1);
      color: var(--accent-cyan);
    }

    .contact-card-item i {
      font-size: 1.2rem;
      color: var(--accent-cyan);
      min-width: 24px;
      text-align: center;
    }

    .contact-card-text {
      font-size: 0.88rem;
      font-weight: 500;
      word-break: break-all;
    }

    footer {
      border-top: 1px solid var(--card-border);
      background: #141d2f;
      text-align: center;
      padding: 2.2rem 1.5rem;
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: auto;
    }

    footer .etwinning-tag {
      display: inline-block;
      margin-top: 0.4rem;
      font-weight: 600;
      color: var(--accent-cyan);
    }

    @media (max-width: 950px) {
      .nav-right {
        width: 100%;
        flex-direction: column;
        align-items: stretch;
        gap: 0.5rem;
      }
      .nav-links {
        display: flex !important;
        overflow-x: auto;
        width: 100%;
        padding: 0.4rem 0;
        gap: 0.4rem;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
      }
      .nav-links::-webkit-scrollbar {
        display: none;
      }
      .nav-links a {
        white-space: nowrap;
        font-size: 0.8rem;
        padding: 0.4rem 0.7rem;
        background: rgba(248, 113, 113, 0.12);
      }
      .lang-switcher {
        align-self: flex-end;
      }
      .home-hero-box, .contact-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <header>
    <nav>
      <div class="logo" onclick="switchTab('home')">
        <i class="fa-solid fa-microchip"></i> Tech-Archaeology
      </div>
      <div class="nav-right">
        <ul class="nav-links">
          <li><a class="nav-item active" data-tab="home" onclick="switchTab('home')" data-i18n="nav_home">Home</a></li>
          <li><a class="nav-item" data-tab="about" onclick="switchTab('about')" data-i18n="nav_about">About</a></li>
          <li><a class="nav-item" data-tab="partners" onclick="switchTab('partners')" data-i18n="nav_partners">Partners</a></li>
          <li><a class="nav-item" data-tab="roadmap" onclick="switchTab('roadmap')" data-i18n="nav_roadmap">Roadmap</a></li>
