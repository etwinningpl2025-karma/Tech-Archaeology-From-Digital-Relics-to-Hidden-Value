<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tech-Archaeology: From Digital Relics to Hidden Value</title>
  <meta name="description" content="An international eTwinning project exploring e-waste, digital archaeology, and sustainable future." />
  
  <!-- Google Fonts & Font Awesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    :root {
      --bg-dark: #1b263b;
      --card-bg: #223049;
      --card-border: #3b4d6c;
      --accent-cyan: #38bdf8;
      --accent-green: #34d399;
      --text-main: #f1f5f9;
      --text-muted: #cbd5e1;
      --accent-red: #f87171;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(27, 38, 59, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border);
    }

    nav {
      max-width: 1250px;
      margin: 0 auto;
      padding: 0.9rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .logo {
      font-weight: 800;
      font-size: 1.25rem;
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-green));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
      cursor: pointer;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 1.2rem;
    }

    .nav-links {
      display: flex;
      list-style: none;
      gap: 0.4rem;
    }

    .nav-links a {
      color: var(--accent-red) !important;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.82rem;
      padding: 0.45rem 0.7rem;
      border-radius: 8px;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .nav-links a:hover {
      background: rgba(248, 113, 113, 0.15);
    }

    .nav-links a.active {
      background: rgba(248, 113, 113, 0.2);
    }

    .lang-switcher {
      display: flex;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 2px;
    }

    .lang-btn {
      border: none;
      background: transparent;
      color: var(--text-muted);
      padding: 0.3rem 0.65rem;
      font-size: 0.75rem;
      font-weight: 700;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .lang-btn.active {
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-green));
      color: #1b263b;
    }

    main {
      flex: 1;
      max-width: 1250px;
      width: 100%;
      margin: 0 auto;
      padding: 2rem 1.5rem 4rem;
    }

    .page-section {
      display: none;
      animation: fadeIn 0.35s ease forwards;
    }

    .page-section.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .hero-banner-container {
      margin-bottom: 2rem;
    }

    .hero-banner-container img {
      width: 100%;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(56, 189, 248, 0.15);
      border: 1px solid var(--card-border);
      display: block;
    }

    .counter-strip {
      background: linear-gradient(90deg, rgba(56, 189, 248, 0.1), rgba(52, 211, 153, 0.1));
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 0.8rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .counter-label {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.9rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .counter-label i {
      color: var(--accent-cyan);
      font-size: 1.1rem;
    }

    .counter-odometer {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #141d2f;
      border: 1px solid var(--card-border);
      padding: 0.35rem 0.8rem;
      border-radius: 8px;
      font-family: monospace;
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--accent-green);
      letter-spacing: 2px;
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.3);
    }

    .section-title {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .section-title h2 {
      font-size: 2.1rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
      color: #fff;
    }

    .section-title p {
      color: var(--text-muted);
      font-size: 1rem;
    }

    .home-hero-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 2.5rem;
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 2rem;
      align-items: center;
      margin-bottom: 2.5rem;
    }

    .home-hero-text h3 {
      font-size: 1.8rem;
      margin-bottom: 1rem;
      color: var(--accent-cyan);
    }

    .home-hero-text p {
      color: var(--text-muted);
      margin-bottom: 1.5rem;
    }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
    }

    .stat-badge {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      padding: 1.2rem;
      border-radius: 12px;
      text-align: center;
    }

    .stat-badge strong {
      display: block;
      font-size: 1.4rem;
      color: var(--accent-green);
    }

    .stat-badge span {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .quick-cta-row {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-green));
      color: #1b263b;
      font-weight: 700;
      font-size: 0.88rem;
      padding: 0.7rem 1.3rem;
      border-radius: 25px;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: opacity 0.3s ease;
    }

    .btn-primary:hover {
      opacity: 0.9;
    }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-main);
      border: 1px solid var(--card-border);
      font-weight: 600;
      font-size: 0.88rem;
      padding: 0.7rem 1.3rem;
      border-radius: 25px;
      text-decoration: none;
      cursor: pointer;
    }

    .pretest-wrapper {
      background: linear-gradient(145deg, #24344d, #223049);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 2.2rem;
      margin-bottom: 3rem;
    }

    .pretest-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.5rem;
      margin-top: 1.5rem;
    }

    .pretest-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 1.6rem;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.3s ease, border-color 0.3s ease;
    }

    .pretest-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent-cyan);
    }

    .pretest-icon {
      font-size: 2.2rem;
      margin-bottom: 0.8rem;
    }
